name: CI/CD Build and Push to ECR
on:
  push:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
        
      - name: Patch version via Maven
        id: versioning
        run: mvn versions:set -DnewVersion=1.0.${{github.run_number}} -DgneneratedBackupPoms=false
      
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-central-1 | \
            docker login --username AWS --password-stdin ${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.eu-central-1.amazonaws.com
      
      - name: Build and Push Docker image 
        env:
          REGISTRY: ${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.eu-central-1.amzonaws.com
          REPO: githubactions/ex4
        run: |
          docker stop java-app || true
          docker rm java-app || true
          docker run -d --name java-app $REGISTRY/$REPO:latest
      
      - name: Verify App is runnig 
        run: docker logs java-app | grep -q "Hello World!" && echo "Success" || exit 1


    